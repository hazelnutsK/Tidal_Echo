name: TidalEcho

options:
  minimumXcodeGenVersion: 2.40.0
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: 5.0
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    TARGETED_DEVICE_FAMILY: 1

targets:
  TidalEcho:
    type: application
    platform: iOS
    sources:
      - path: TidalEcho
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tidalecho.personal
        PRODUCT_NAME: Tidal Echo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Tidal Echo
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.social-networking
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 选择图片发送到你自己的 Tidal Echo 频道。
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 用于录制语音消息和进行实时语音通话。
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: 用于在语音通话中把你的话实时分段转成文字。
        INFOPLIST_KEY_UIBackgroundModes:
          - audio
          - fetch
          - voip
        INFOPLIST_KEY_UIAppFonts:
          - AnthropicSerifVariable.ttf
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    scheme:
      gatherCoverageData: false
