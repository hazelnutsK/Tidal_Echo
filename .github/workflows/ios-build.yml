name: iOS Build

on:
  workflow_dispatch:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Verify SSE framing and live delivery
        working-directory: ios
        run: |
          set -euo pipefail
          swiftc -parse-as-library -target "$(uname -m)-apple-macosx13.0" \
            TidalEcho/Core/SSEEventParser.swift \
            TidalEcho/Core/SSEClient.swift \
            Tests/SSERegressionTests.swift \
            -o "$RUNNER_TEMP/sse-regressions"
          python3 Tests/run_sse_regressions.py "$RUNNER_TEMP/sse-regressions"

      - name: Prepare app icons
        working-directory: ios
        run: bash scripts/prepare-assets.sh

      - name: Verify per-message API usage
        working-directory: ios
        run: |
          set -euo pipefail
          swiftc -parse-as-library \
            TidalEcho/Models/APIMessageUsage.swift \
            Tests/APIMessageUsageTests.swift \
            -o "$RUNNER_TEMP/api-usage-tests"
          "$RUNNER_TEMP/api-usage-tests"

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build for iOS Simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project TidalEcho.xcodeproj \
            -scheme TidalEcho \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData-Simulator \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build unsigned device app
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project TidalEcho.xcodeproj \
            -scheme TidalEcho \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData-Device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Ad-hoc sign nested code for sideloading
        working-directory: ios
        run: |
          set -euo pipefail
          APP_PATH="DerivedData-Device/Build/Products/Release-iphoneos/Tidal Echo.app"
          UPLOAD_APPEX="$APP_PATH/PlugIns/Tidal Echo Screen Share.appex"

          codesign --force --sign - --generate-entitlement-der "$UPLOAD_APPEX"
          codesign --force --sign - --generate-entitlement-der "$APP_PATH"

          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Package unsigned IPA
        working-directory: ios
        run: |
          APP_PATH="DerivedData-Device/Build/Products/Release-iphoneos/Tidal Echo.app"
          test -d "$APP_PATH"
          mkdir -p Payload
          ditto "$APP_PATH" "Payload/Tidal Echo.app"
          ditto -c -k --sequesterRsrc --keepParent Payload TidalEcho-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: TidalEcho-unsigned-ipa
          path: ios/TidalEcho-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
