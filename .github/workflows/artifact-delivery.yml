name: Temporary IPA Delivery

on:
  push:
    paths:
      - ".github/workflows/artifact-delivery.yml"

permissions:
  actions: read
  contents: write

jobs:
  deliver:
    if: github.ref == 'refs/heads/ios-reading-room'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download successful IPA artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 35225543309 --repo "$GITHUB_REPOSITORY" --name TidalEcho-unsigned-ipa --dir artifact

      - name: Publish chunks to temporary delivery branch
        run: |
          mkdir -p delivery
          split -b 524288 -d -a 3 artifact/TidalEcho-unsigned.ipa delivery/ipa.part.
          sha256sum artifact/TidalEcho-unsigned.ipa > delivery/SHA256SUMS
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f delivery/ipa.part.* delivery/SHA256SUMS
          tree=$(git write-tree)
          commit=$(printf '%s\n' 'Temporary IPA delivery for run 35225543309' | git commit-tree "$tree" -p "$GITHUB_SHA")
          git push --force origin "$commit:refs/heads/ios-build-delivery"
